<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email</title>
    <style>
        /* --- 1. CSS VARIABLES (THEMING) --- */
        :root {
            /* Default Dark Mode Palette */
            --c-canvas: 5, 5, 5;         /* #050505 */
            --c-surface: 18, 18, 18;     /* #121212 */
            --c-primary: 255, 255, 255;  /* #FFFFFF */
            --c-secondary: 156, 163, 175;/* #9CA3AF */
            --c-accent: 204, 255, 0;     /* #CCFF00 - Electric Lime */
            --c-divider: 255, 255, 255;  /* White borders */
            
            /* Glassmorphism Tokens */
            --glass-bg: rgba(18, 18, 18, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            
            --grid-color: rgba(255, 255, 255, 0.05);
            --stroke-color: rgba(255, 255, 255, 0.2); 
        }

        /* Light Mode Overrides */
        @media (prefers-color-scheme: light) {
            :root {
                --c-canvas: 248, 250, 252;   /* #F8FAFC */
                --c-surface: 255, 255, 255;  /* #FFFFFF */
                --c-primary: 15, 23, 42;     /* #0F172A */
                --c-secondary: 100, 116, 139;/* #64748B */
                --c-accent: 180, 230, 0;     /* #B4E600 */
                --c-divider: 0, 0, 0;        /* Black borders */

                --glass-bg: rgba(255, 255, 255, 0.7);
                --glass-border: rgba(0, 0, 0, 0.05);
                
                --grid-color: rgba(0, 0, 0, 0.05);
                --stroke-color: rgba(0, 0, 0, 0.2);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: rgb(var(--c-canvas));
            color: rgb(var(--c-primary));
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            position: relative;
            /* bg-grid pattern simulation in simple CSS for email compatibility */
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .card {
            background: var(--glass-bg);
            border: 2px solid rgb(var(--c-accent));
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* Safari support */
            padding: 40px;
            margin: 20px;
            /* Removed shadow as requested */
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--c-primary), 0.2), transparent);
            margin: 0 0 30px 0;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, rgb(var(--c-primary)), rgb(var(--c-secondary)));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Fallback for clients that don't support text-fill-color */
            color: rgb(var(--c-accent)); 
        }

        .tagline {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            color: rgba(var(--c-primary), 0.5);
            line-height: 1.4;
        }

        .tagline .highlight {
            color: rgb(var(--c-accent));
            display: block; /* Make it stack */
        }

        .message {
            color: rgb(var(--c-secondary));
            font-size: 16px;
            text-align: center;
            margin-bottom: 40px;
        }

        .code-container {
            background: rgba(var(--c-surface), 0.5);
            border: 1px solid var(--stroke-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin: 30px 0;
        }

        .code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 36px;
            font-weight: 800;
            color: rgb(var(--c-primary));
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(var(--c-accent), 0.3);
        }

        .expiry-note {
            text-align: center;
            color: rgb(var(--c-secondary));
            font-size: 13px;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgb(var(--c-secondary));
            font-size: 12px;
            opacity: 0.7;
        }
        
        .accent-text {
             color: rgb(var(--c-accent));
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>CityHunter</h1>
                <div class="tagline">
                    DON'T JUST<br>
                    VISIT<br>
                    <span class="highlight">PLAY THE CITY</span>
                </div>
            </div>
            
            <div class="separator"></div>
            
            <p class="message">Confirm your identity to start your journey.</p>
            
            <div class="code-container">
                <span class="code">{{ verification_code }}</span>
            </div>
            
            <p class="expiry-note">
                This code expires in <span class="accent-text">2 minutes</span>.
            </p>
            
            <p class="message" style="font-size: 14px; margin-top: 30px;">
                If you didn't request this, just ignore it. You will stay safe.
            </p>
        </div>
        
        <div class="footer">
            <p>&copy; 2026 CityHunter. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
