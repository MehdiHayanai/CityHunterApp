        window.copyToClipboard = (text, btnId) => {
            const animateSuccess = () => {
                const btn = document.getElementById(btnId);
                if (btn) {
                    btn.classList.add('copy-animate');
                    const icon = btn.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-copy');
                        icon.classList.add('fa-check');
                        setTimeout(() => {
                            icon.classList.remove('fa-check');
                            icon.classList.add('fa-copy');
                            btn.classList.remove('copy-animate');
                        }, 1500);
                    }
                }
            };

            const fallbackCopy = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; 
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) animateSuccess();
                    else console.error('Fallback copy failed.');
                } catch (err) {
                    console.error('Fallback copy error:', err);
                }
                document.body.removeChild(textArea);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(animateSuccess)
                    .catch(err => {
                        console.warn('Clipboard API blocked, falling back to execCommand:', err);
                        fallbackCopy(text);
                    });
            } else {
                fallbackCopy(text);
            }

                            <p className="text-xs text-secondary font-mono mb-2">{item.type} • {item.dist}</p>
                            <div className="mt-auto flex justify-between items-end">
                                <div className="flex items-center gap-1 text-[10px] text-yellow-500 bg-canvas px-2 py-1 rounded border border-divider">
                                    <i className="fa-solid fa-star"></i> {item.rating}
                                </div>
                                
                                {item.xp ? (
                                    <div className="text-right font-mono">
                                        <span className="text-accent font-bold text-sm">+{item.xp}</span> <span className="text-[10px] text-secondary">XP</span>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-1.5 text-purple-400">
                                        <i className="fa-solid fa-medal"></i>
                                        <span className="font-bold text-xs">{item.swagg}</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div 
                    onClick={() => onSelect(item.id)}
                    className="group bg-surface rounded-2xl border border-divider overflow-hidden hover:border-accent transition-all cursor-pointer relative"
                >
                    <div className="absolute top-3 right-3 z-10 bg-black/60 backdrop-blur px-2 py-1 rounded border border-white/10 font-mono text-xs font-bold">
                        {item.xp ? (
                            <span className="text-accent">+{item.xp} XP</span>
                        ) : (
                             <span className="text-purple-400"><i className="fa-solid fa-medal mr-1"></i>PIN</span>
                        )}
                    </div>
                    <div className="h-40 overflow-hidden relative">
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent opacity-60 z-[1]"></div>
                        <img src={item.img} alt={item.name} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                        <div className="absolute bottom-3 left-3 z-[2]">
                            <p className="text-[10px] text-accent font-mono uppercase tracking-wider mb-0.5">{item.type}</p>
                            <h3 className="text-white font-bold text-sm">{item.name}</h3>
                        </div>
                    </div>
                    <div className="p-3 flex justify-between items-center text-xs font-mono text-secondary bg-surface">
                        <span className="flex items-center gap-1"><i className="fa-solid fa-location-arrow"></i> {item.dist}</span>
                        <span className="flex items-center gap-1 text-primary"><i className="fa-solid fa-user-group"></i> {item.visitors} here</span>
                    </div>
                </div>
            );
        };

        const WalkCard = ({ walk, onSelect }) => (
            <div 
                onClick={() => onSelect(walk)}
                className="group bg-surface p-4 rounded-2xl border border-divider hover:border-accent transition-all cursor-pointer"
            >
                <div className="flex justify-between items-start mb-2">
                    <h3 className="font-bold text-lg text-primary">{walk.name}</h3>
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-accent/20 text-accent uppercase">{walk.difficulty}</span>
                </div>
                <p className="text-xs text-secondary mb-4 line-clamp-2">{walk.desc}</p>
                <div className="flex items-center justify-between text-xs font-mono text-secondary">
                    <span className="flex items-center gap-1"><i className="fa-regular fa-clock"></i> {walk.estTime}</span>
                    <span className="flex items-center gap-1"><i className="fa-solid fa-location-dot"></i> {walk.stopIds.length} Stops</span>
                </div>
            </div>
        );

        const WalkStopItem = ({ item, isExcluded, onToggle }) => (
            <div className={`flex items-center gap-3 p-3 rounded-xl border transition-all ${isExcluded ? 'opacity-50 border-transparent bg-canvas' : 'bg-surface border-divider'}`}>
                <div className="w-10 h-10 rounded-lg overflow-hidden shrink-0">
                    <img src={item.img} className="w-full h-full object-cover grayscale" />
                </div>
                <div className="flex-1 min-w-0">
                    <h4 className={`text-sm font-bold truncate ${isExcluded ? 'line-through text-secondary' : 'text-primary'}`}>{item.name}</h4>
                    <p className="text-[10px] text-secondary truncate">{item.type}</p>
                </div>
                <button 
                    onClick={(e) => { e.stopPropagation(); onToggle(item.id); }}
                    className={`w-8 h-8 flex items-center justify-center rounded-lg transition-colors ${isExcluded ? 'text-secondary hover:text-accent' : 'text-accent hover:bg-canvas'}`}
                >
                    <i className={`fa-solid ${isExcluded ? 'fa-plus' : 'fa-check'}`}></i>
                </button>
            </div>
        );

        const LeafletMap = ({ isDark, items, selectedId, walkPath }) => {
            const mapContainer = useRef(null);
            const mapInstance = useRef(null);
            const markersRef = useRef([]);
            const polylineRef = useRef(null);

            useEffect(() => {
                // Init Map
                if (!mapInstance.current && mapContainer.current) {
                    mapInstance.current = L.map(mapContainer.current, {
                        zoomControl: false,
                        attributionControl: false
                    }).setView([35.6915, 139.7034], 14);

                    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance.current);
                }

                const map = mapInstance.current;

                // Tile Layer
                const tileUrl = isDark 
                    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' 
                    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
                
                map.eachLayer((layer) => {
                    if (layer instanceof L.TileLayer) map.removeLayer(layer);
                });

                L.tileLayer(tileUrl, { subdomains: 'abcd', maxZoom: 20 }).addTo(map);

                // --- Markers ---
                markersRef.current.forEach(m => map.removeLayer(m));
                markersRef.current = [];

                const createCustomIcon = (isWalkStop, index) => {
                    const color = isDark ? '#CCFF00' : '#B4E600';
                    // If it's a walk stop, show a number or specialized style? For now, stick to circle
                    return L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div style="
                            background-color: ${color};
                            width: 16px;
                            height: 16px;
                            border-radius: 50%;
                            border: 2px solid white;
                            box-shadow: 0 0 15px ${color};
                            animation: pulse 2s infinite;
                            display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; color: black;
                        ">${isWalkStop ? index + 1 : ''}</div>`,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });
                };

                items.forEach((item, idx) => {
                    const isWalkStop = !!walkPath; // If walkPath exists, we assume items are ordered stops
                    const marker = L.marker([item.lat, item.lng], { icon: createCustomIcon(isWalkStop, idx) })
                        .addTo(map);
                    marker.monumentId = item.id;

                     const rewardHTML = item.xp 
                        ? `<div style="color: var(--color-accent); font-weight: bold; font-family: 'Roboto Mono'; font-size: 12px;">+${item.xp} XP</div>`
                        : `<div style="color: #c084fc; font-weight: bold; font-family: 'Roboto Mono'; font-size: 11px; display: flex; align-items: center; gap: 4px; justify-content: flex-end;"><i class="fa-solid fa-medal"></i> ${item.swagg}</div>`;

                    const popupContent = `
                        <div style="font-family: 'Inter', sans-serif;">
                            <div style="height: 120px; width: 100%; position: relative; overflow: hidden; border-bottom: 1px solid var(--border-divider);">
                                <img src="${item.img}" style="width: 100%; height: 100%; object-fit: cover;" alt="${item.name}">
                                <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 10px;">
                                    <span style="background-color: var(--color-accent); color: black; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-family: 'Roboto Mono'; text-transform: uppercase;">${item.type}</span>
                                </div>
                            </div>
                            <div style="padding: 16px; background-color: var(--bg-surface);">
                                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                    <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.2;">${item.name}</h3>
                                    <div style="text-align: right;">${rewardHTML}</div>
                                </div>
                                <div style="font-family: 'Roboto Mono'; font-size: 10px; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 4px;">
                                    <i class="fa-solid fa-location-crosshairs"></i> ${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}
                                </div>
                                <div style="background-color: var(--bg-canvas); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-divider); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
                                    <div style="font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">
                                        <i class="fa-solid fa-map-pin" style="margin-right: 4px;"></i> ${item.address}
                                    </div>
                                    <button id="copy-btn-${item.id}" onclick="copyToClipboard('${item.address}', 'copy-btn-${item.id}')" style="background: none; border: none; cursor: pointer; color: var(--text-primary); padding: 4px; transition: color 0.2s;"><i class="fa-regular fa-copy"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { maxWidth: 300, minWidth: 280, className: 'custom-popup-theme' });
                    markersRef.current.push(marker);
                });

                // --- Polyline for Walks ---
                if (polylineRef.current) {
                    map.removeLayer(polylineRef.current);
                    polylineRef.current = null;
                }

                if (walkPath && walkPath.length > 1) {
                    const latLngs = walkPath.map(item => [item.lat, item.lng]);
                    polylineRef.current = L.polyline(latLngs, {
                        color: isDark ? '#CCFF00' : '#B4E600',
                        weight: 3,
                        opacity: 0.8,
                        dashArray: '10, 10',
                        lineCap: 'round'
                    }).addTo(map);
                    
                    // Fit bounds to walk
                    map.fitBounds(polylineRef.current.getBounds(), { padding: [50, 50] });
                }

            }, [isDark, items, walkPath]);

            // Handle Redirection logic
            useEffect(() => {
                if (selectedId && mapInstance.current) {
                    const item = items.find(i => i.id === selectedId);
                    if (item) {
                        mapInstance.current.flyTo([item.lat, item.lng], 16, { duration: 1.5 });
                        setTimeout(() => {
                             const marker = markersRef.current.find(m => m.monumentId === selectedId);
                             if (marker) marker.openPopup();
                        }, 500);
                    }
                }
            }, [selectedId, items]);

            useEffect(() => {
                const resizeObserver = new ResizeObserver(() => {
                    if (mapInstance.current) mapInstance.current.invalidateSize();
                });
                if (mapContainer.current) resizeObserver.observe(mapContainer.current);
                return () => resizeObserver.disconnect();
            }, []);

            return <div ref={mapContainer} className="w-full h-full z-0" />;
        };

        const Dashboard = () => {
            const [isDark, setIsDark] = useState(true);
            const [activeTab, setActiveTab] = useState('Monument'); // 'Monument', 'Event', 'Walk'
            const [activeCategories, setActiveCategories] = useState(['all']);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMonumentId, setSelectedMonumentId] = useState(null);
            
            // Walk State
            const [activeWalk, setActiveWalk] = useState(null); // The Walk Object
            const [excludedStopIds, setExcludedStopIds] = useState([]); // IDs of stops user toggled off
            
            const [sidebarWidth, setSidebarWidth] = useState(450);
            const [isCollapsed, setIsCollapsed] = useState(false);
            const [isResizing, setIsResizing] = useState(false);
            const containerRef = useRef(null);

            // Initialize Theme
            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            // Reset walk state when switching tabs
            useEffect(() => {
                if (activeTab !== 'Walk') {
                    setActiveWalk(null);
                    setExcludedStopIds([]);
                }
            }, [activeTab]);

            const toggleCategory = (id) => {
                setActiveCategories(prev => {
                    if (id === 'all') return ['all'];
                    let newCats = prev.filter(c => c !== 'all');
                    if (newCats.includes(id)) newCats = newCats.filter(c => c !== id);
                    else newCats.push(id);
                    return newCats.length === 0 ? ['all'] : newCats;
                });
            };

            // --- FILTER LOGIC ---
            const filteredItems = useMemo(() => {
                if (activeTab === 'Walk') {
                    // In Walk tab, if a walk is active, we return the stops associated with it
                    if (activeWalk) {
                        return activeWalk.stopIds
                            .map(id => getItemById(id))
                            .filter(item => item && !excludedStopIds.includes(item.id));
                    }
                    return []; // If no walk selected, map shows nothing or maybe all walks starts? For now nothing.
                }

                let sourceData = [];
                if (activeTab === 'Monument') sourceData = MONUMENTS;
                else if (activeTab === 'Event') sourceData = EVENTS;

                return sourceData.filter(m => {
                    const isAll = activeCategories.includes('all');
                    const validTypes = activeCategories.map(catId => CATEGORIES.find(c => c.id === catId)?.typeValue).filter(Boolean);
                    const categoryMatch = isAll || validTypes.includes(m.type);
                    const query = searchQuery.toLowerCase();
                    const searchMatch = !query || 
                        m.name.toLowerCase().includes(query) || 
                        m.address.toLowerCase().includes(query) || 
                        `${m.lat}, ${m.lng}`.includes(query);
                    return categoryMatch && searchMatch;
                });
            }, [activeCategories, searchQuery, activeTab, activeWalk, excludedStopIds]);

            const handleWalkSelect = (walk) => {
                setActiveWalk(walk);
                setExcludedStopIds([]); // Reset exclusions
            };

            const toggleWalkStop = (id) => {
                setExcludedStopIds(prev => 
                    prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
                );
            };

            // Resizing Logic
            const startResizing = (e) => { e.preventDefault(); setIsResizing(true); };
            const stopResizing = () => { setIsResizing(false); };
            const resize = (e) => {
                if (isResizing && containerRef.current) {
                    const newWidth = e.clientX - containerRef.current.getBoundingClientRect().left;
                    if (newWidth > 300 && newWidth < 800) setSidebarWidth(newWidth);
                }
            };

            useEffect(() => {
                window.addEventListener('mousemove', resize);
                window.addEventListener('mouseup', stopResizing);
                return () => {
                    window.removeEventListener('mousemove', resize);
                    window.removeEventListener('mouseup', stopResizing);
                };
            }, [isResizing]);

            return (
                <div ref={containerRef} className="flex flex-col h-screen overflow-hidden bg-canvas text-primary selection:bg-accent selection:text-black">
                    <Navbar isDark={isDark} toggleTheme={() => setIsDark(!isDark)} activeTab={activeTab} setActiveTab={setActiveTab} />

                    <div className="flex flex-1 overflow-hidden relative">
                        
                        {/* LEFT PANEL */}
                        <div 
                            style={{ width: isCollapsed ? '0px' : `${sidebarWidth}px`, opacity: isCollapsed ? 0 : 1, transition: isResizing ? 'none' : 'width 0.3s ease, opacity 0.2s ease' }}
                            className="h-full overflow-hidden relative z-10 flex flex-col border-r border-divider bg-canvas shrink-0"
                        >
                            <div className="h-full overflow-y-auto no-scrollbar">
                                <div className="p-6 md:p-8 space-y-6 pb-32 min-w-[350px]">
                                    
                                    {/* Header */}
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h2 className="text-3xl font-black mb-2 tracking-tight">
                                                {activeTab === 'Walk' && activeWalk ? 'Route Planner' : 
                                                 activeTab === 'Walk' ? 'Available Routes' :
                                                 activeTab === 'Event' ? 'Event Protocol' : 'Mission Control'}
                                            </h2>
                                            <p className="text-secondary">
                                                {activeTab === 'Walk' && activeWalk ? 'Customize your itinerary.' :
                                                 activeTab === 'Walk' ? 'Select a route to begin.' :
                                                 activeTab === 'Event' ? 'Locate active events.' : 'Select a target.'}
                                            </p>
                                        </div>
                                        <button onClick={() => setIsCollapsed(true)} className="text-secondary hover:text-accent p-2 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface transition-colors">
                                            <i className="fa-solid fa-angles-left"></i>
                                        </button>
                                    </div>

                                    {/* Content Switcher */}
                                    {activeTab === 'Walk' ? (
                                        activeWalk ? (
                                            /* WALK DETAILS VIEW */
                                            <div className="space-y-6 animate-fade-in">
                                                <button onClick={() => setActiveWalk(null)} className="flex items-center gap-2 text-xs font-bold text-secondary hover:text-accent transition-colors">
                                                    <i className="fa-solid fa-arrow-left"></i> BACK TO ROUTES
                                                </button>
                                                
                                                <div className="bg-surface p-4 rounded-2xl border border-accent/30 shadow-[0_0_20px_rgba(var(--color-accent-rgb),0.1)]">
                                                    <h3 className="text-xl font-bold mb-1 text-primary">{activeWalk.name}</h3>
                                                    <div className="flex gap-4 text-xs font-mono text-secondary mb-4">
                                                        <span><i className="fa-regular fa-clock"></i> ~{activeWalk.estTime}</span>
                                                        <span><i className="fa-solid fa-layer-group"></i> {activeWalk.stopIds.length} Stops</span>
                                                    </div>
                                                    <div className="h-1 bg-divider rounded-full overflow-hidden">
                                                        <div className="h-full bg-accent transition-all duration-500" style={{ width: `${(filteredItems.length / activeWalk.stopIds.length) * 100}%` }}></div>
                                                    </div>
                                                    <div className="flex justify-between text-[10px] mt-2 font-mono">
                                                        <span>STOPS ACTIVE: {filteredItems.length}</span>
                                                        <span>TOTAL: {activeWalk.stopIds.length}</span>
                                                    </div>
                                                </div>

                                                <div className="space-y-3">
                                                    <h4 className="font-bold text-sm text-secondary uppercase tracking-wider">Itinerary</h4>
                                                    {activeWalk.stopIds.map((id, index) => {
                                                        const item = getItemById(id);
                                                        const isExcluded = excludedStopIds.includes(id);
                                                        if (!item) return null;
                                                        
                                                        return (
                                                            <div key={id} className="relative">
                                                                {/* Connector Line (visual only) */}
                                                                {index !== activeWalk.stopIds.length - 1 && (
                                                                    <div className={`absolute left-[19px] top-10 bottom-[-12px] w-[2px] ${isExcluded ? 'bg-divider' : 'bg-accent/50'}`}></div>
                                                                )}
                                                                <WalkStopItem 
                                                                    item={item} 
                                                                    isExcluded={isExcluded} 
                                                                    onToggle={toggleWalkStop} 
                                                                />
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ) : (
                                            /* WALK LIST VIEW */
                                            <div className="space-y-4">
                                                {WALKS.map(walk => (
                                                    <WalkCard key={walk.id} walk={walk} onSelect={handleWalkSelect} />
                                                ))}
                                            </div>
                                        )
                                    ) : (
                                        /* MONUMENT/EVENT LIST VIEW */
                                        <>
                                            <SearchBar searchQuery={searchQuery} setSearchQuery={setSearchQuery} />
                                            <div className="flex gap-2 overflow-x-auto pb-2 -mx-6 px-6 no-scrollbar">
                                                {CATEGORIES.map(cat => (
                                                    <CategoryPill key={cat.id} {...cat} isActive={activeCategories.includes(cat.id)} onClick={() => toggleCategory(cat.id)} />
                                                ))}
                                            </div>
                                            
                                            {filteredItems.length === 0 && (
                                                <div className="text-center py-12 text-secondary">
                                                    <i className="fa-solid fa-radar fa-2x mb-3 opacity-50"></i>
                                                    <p>No signals detected matching query.</p>
                                                </div>
                                            )}

                                            {filteredItems.length > 0 && (
                                                <section>
                                                    <div className="flex justify-between items-end mb-4">
                                                        <h3 className="font-bold text-lg">Detected Locations</h3>
                                                    </div>
                                                    <div className="flex flex-col gap-4">
                                                        {filteredItems.map(m => (
                                                            <MonumentCard key={`list-${m.id}`} item={m} layout="list" onSelect={setSelectedMonumentId} />
                                                        ))}
                                                    </div>
                                                </section>
                                            )}
                                        </>
                                    )}
                                </div>
                                <div className="sticky bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-canvas to-transparent pointer-events-none"></div>
                            </div>
                        </div>

                        {/* RESIZER */}
                        <div className={`resizer h-full border-r border-divider hover:border-accent/50 ${isCollapsed ? 'hidden' : ''} ${isResizing ? 'active' : ''}`} onMouseDown={startResizing}></div>

                        {/* RIGHT PANEL (MAP) */}
                        <div className="flex-1 relative bg-surface overflow-hidden">
                            {isCollapsed && (
                                <button onClick={() => setIsCollapsed(false)} className="absolute top-4 left-4 z-[9999] bg-surface border border-divider text-accent hover:text-primary hover:bg-canvas w-10 h-10 flex items-center justify-center rounded-lg shadow-xl transition-all">
                                    <i className="fa-solid fa-angles-right"></i>
                                </button>
                            )}

                            <LeafletMap 
                                isDark={isDark} 
                                items={filteredItems} 
                                selectedId={selectedMonumentId}
                                walkPath={activeTab === 'Walk' && activeWalk ? filteredItems : null}
                            />

                            <div className="absolute top-6 left-1/2 -translate-x-1/2 z-[400]">
                                <button className="bg-surface/90 backdrop-blur-md border border-divider px-5 py-2 rounded-full text-xs font-bold flex items-center gap-2 hover:bg-surface transition-all group shadow-lg text-primary">
                                    <div className="w-2 h-2 rounded-full bg-accent animate-pulse"></div>
                                    {activeTab === 'Walk' ? 'Route Active' : 'Scanning Area'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
