name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'hunterBack/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 416.0.0'

      - name: Deploy Backend to Cloud Run
        working-directory: ./hunterBack
        run: |
          gcloud run deploy hunterback \
            --source . \
            --region europe-west9 \
            --allow-unauthenticated \
            --quiet \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }}" \
            --set-env-vars "DB_NAME=${{ secrets.DB_NAME }}" \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars "API_KEY=${{ secrets.API_BASE_KEY }}" \
            --set-env-vars "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            --set-env-vars "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "FRONT_URL=${{ secrets.FRONT_URL }}"

      - name: Post-Deploy Optimization
        run: |
          # Ensures we scale to zero to keep the bill at $0 and use CPU boost for faster startups
          gcloud run services update hunterback \
            --min-instances 0 \
            --cpu-boost \
            --region europe-west9

      - name: Get Service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe hunterback \
            --region europe-west9 \
            --format='value(status.url)')
          echo "Backend deployed at: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
